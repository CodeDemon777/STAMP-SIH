# India Post Philately Portal - Production Cloud Profile
server.port=${PORT:8085}

# Production Database: dynamic fallback to in-memory H2 if no external datasource is configured
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:philately_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

philately.app.jwtSecret=${PHILATELY_APP_JWT_SECRET:IndiaPostSIHPhilatelyDepositAccountSecureKey2026SuperSecretStringMustBeLongEnoughForHS512}
philately.app.jwtExpirationMs=86400000

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
