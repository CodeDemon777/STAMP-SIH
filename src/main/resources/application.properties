# India Post Philately Portal - Application Configuration
spring.application.name=stamp-sih-philately
server.port=8085

# Persistent H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/philately_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Security / JWT
philately.app.jwtSecret=IndiaPostSIHPhilatelyDepositAccountSecureKey2026SuperSecretStringMustBeLongEnoughForHS512
philately.app.jwtExpirationMs=86400000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
