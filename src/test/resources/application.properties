# Test Environment Configuration - Isolated In-Memory Database
spring.datasource.url=jdbc:h2:mem:philately_test_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

philately.app.jwtSecret=TestSecretKeyMustBeLongEnoughForHS512AlgorithmTestingIndiaPost2026SuperSecure
philately.app.jwtExpirationMs=86400000
